name: publish

# Pushing a tag vX.Y.Z publishes @cyberrakshak/cli X.Y.Z to npm, with provenance, by npm's trusted publishing (OIDC): no
# npm token is stored anywhere. The package's trusted publisher on npmjs.com names this repository, this workflow file
# (publish.yml) and the environment "npm". A version npm already has is skipped, so a first version published by hand
# (see README.md "For maintainers") and a re-run are both safe.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or later (trusted publishing)
        run: npm install -g npm@11 && npm --version
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid && git config --global init.defaultBranch main
      - run: npm test
      - run: node scripts/check-pack.mjs
      - name: The tag is the package's version
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const { name, version } = require("./package.json");
            if (version !== tag) { console.error(name + " is " + version + ", the tag is " + tag); process.exit(1); }'
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@cyberrakshak/cli@$version" version >/dev/null 2>&1; then
            echo "@cyberrakshak/cli@$version is on npm already: skipped"
          else
            npm publish --provenance --access public
          fi
